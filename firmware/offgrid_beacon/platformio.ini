; Build with PlatformIO:  cd firmware/offgrid_beacon && pio run -t upload && pio device monitor
; Or open offgrid_beacon.ino in the Arduino IDE 2.x (board "Heltec WiFi LoRa 32(V3)", libraries below).

[platformio]
src_dir = .

[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
    mikalhart/TinyGPSPlus@^1.1.0
; Bluetooth + Wi-Fi + TLS need more flash than the default partition table leaves for the app.
board_build.partitions = huge_app.csv
